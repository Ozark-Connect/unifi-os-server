name: Extract image for linux-amd64

on:
  workflow_call:
    inputs:
      UOS_DOWNLOAD:
        required: true
        type: string
    outputs:
      PODMAN_IMAGE_TAG:
        description: "Tag for uosserver"
        value: ${{ jobs.extract-image.outputs.PODMAN_IMAGE_TAG }}
  workflow_dispatch:
    inputs:
      UOS_DOWNLOAD:
        description: "UniFi OS Server download URL"
        required: true
        type: string

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  extract-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      PODMAN_IMAGE_TAG: ${{ steps.tag.outputs.PODMAN_IMAGE_TAG }}
  
    steps:     
      - name: Cleanup disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Ensure podman is at /usr/bin/podman
        run: |
          set -euo pipefail
          # The installer hardcodes /usr/bin/podman -- having podman merely on
          # PATH is not enough. Runner images vary: some ship it at
          # /usr/bin/podman, some elsewhere, some not at all.
          if [ -x /usr/bin/podman ]; then
            echo "podman already at /usr/bin/podman: $(/usr/bin/podman --version)"
          elif command -v podman >/dev/null 2>&1; then
            found="$(command -v podman)"
            echo "podman at $found but not /usr/bin/podman; linking."
            sudo ln -sf "$found" /usr/bin/podman
            /usr/bin/podman --version
          else
            echo "podman missing from runner image; installing."
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
            /usr/bin/podman --version
          fi

      - name: Install UniFi OS Server
        run: |
          mkdir -p /home/runner/.config/containers
          chmod 755 /home/runner /home/runner/.config /home/runner/.config/containers
          touch /home/runner/.config/containers/storage.conf
          chmod 755 /home/runner/.config/containers/storage.conf
          curl -o unifi-os-server "${{ inputs.UOS_DOWNLOAD }}"
          sudo chmod +x unifi-os-server
          echo "y" | sudo ./unifi-os-server
        # The installer exits non-zero even on success (it cannot start systemd
        # units on the runner), so its status cannot be trusted -- see the
        # explicit check below instead.
        continue-on-error: true

      # Without this, a failed install surfaces later as a confusing
      # "cp: cannot stat .../storage/..." from the copy step.
      - name: Verify install produced container storage
        run: |
          set -euo pipefail
          src=/home/uosserver/.local/share/containers/storage
          if [ ! -d "$src" ]; then
            echo "Container storage not at $src. Searching:" >&2
            sudo find / -xdev -type d -name storage -path '*containers*' 2>/dev/null | head -20 >&2
            echo "--- /home ---" >&2; sudo ls -la /home 2>&1 | head -10 >&2
            echo "--- uosserver home ---" >&2; sudo ls -laR /home/uosserver 2>&1 | head -40 >&2
            echo "--- /var/lib/uosserver ---" >&2; sudo ls -la /var/lib/uosserver 2>&1 | head -20 >&2
            echo "UniFi OS Server install did not produce container storage." >&2
            exit 1
          fi
          echo "Container storage present. Driver directories:"
          sudo ls -1 "$src"
      
      # Copy the whole storage tree rather than hardcoded overlay* directories.
      # The driver depends on the podman version the runner happens to ship
      # (overlay vs vfs), and naming the driver explicitly breaks whenever the
      # runner image changes.
      - name: Get uosserver image for runner
        run: |
          set -euo pipefail
          mkdir -p /home/runner/.local/share/containers/storage
          sudo cp -a /home/uosserver/.local/share/containers/storage/. /home/runner/.local/share/containers/storage/
          sudo chown -R runner:runner /home/runner/.local/share/containers/storage
          podman images

      - name: Login to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.REGISTRY }}
      
      - name: Upload uosserver image
        id: tag
        run: |
          PODMAN_IMAGE_TAG=$(podman images uosserver --noheading | awk '{print $2}')
          PODMAN_IMAGE_ID=$(podman images uosserver --noheading | awk '{print $3}')
          REPO_OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          podman push $PODMAN_IMAGE_ID $REGISTRY/$REPO_OWNER_LC/uosserver:$PODMAN_IMAGE_TAG-linux-amd64

          echo "PODMAN_IMAGE_TAG=$PODMAN_IMAGE_TAG" >> "$GITHUB_OUTPUT"