name: Extract image for linux-arm64

on:
  workflow_call:
    inputs:
      UOS_DOWNLOAD:
        required: true
        type: string
    outputs:
      PODMAN_IMAGE_TAG:
        description: "Tag for uosserver"
        value: ${{ jobs.extract-image.outputs.PODMAN_IMAGE_TAG }}
  workflow_dispatch:
    inputs:
      UOS_DOWNLOAD:
        description: "UniFi OS Server download URL"
        required: true
        type: string

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  extract-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      PODMAN_IMAGE_TAG: ${{ steps.tag.outputs.PODMAN_IMAGE_TAG }}
  
    steps:     
      - name: Cleanup disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The installer hardcodes /usr/bin/podman and aborts without it. Runner
      # images are not consistent about this: some ship podman at
      # /usr/bin/podman, others only at /usr/local/bin/podman. On the latter the
      # install aborts, no uosserver user is created, and the failure surfaces
      # two steps later as "cp: cannot stat .../containers/storage/overlay/.".
      - name: Ensure podman is at /usr/bin/podman
        run: |
          set -euo pipefail
          if [ -x /usr/bin/podman ]; then
            echo "already at /usr/bin/podman: $(/usr/bin/podman --version)"
          elif command -v podman >/dev/null 2>&1; then
            found="$(command -v podman)"
            echo "podman at $found; linking to /usr/bin/podman"
            sudo ln -sf "$found" /usr/bin/podman
          else
            echo "podman absent; installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
          fi
          /usr/bin/podman --version

      - name: Install UniFi OS Server
        run: |          
          mkdir -p /home/runner/.config/containers
          chmod 755 /home/runner /home/runner/.config /home/runner/.config/containers
          touch /home/runner/.config/containers/storage.conf
          chmod 755 /home/runner/.config/containers/storage.conf
          curl -o unifi-os-server "${{ inputs.UOS_DOWNLOAD }}"
          sudo chmod +x unifi-os-server
          echo "y" | sudo ./unifi-os-server
        continue-on-error: true
      
      # The install step cannot fail the job (the installer exits non-zero even
      # on success, as it cannot start systemd units on a runner), so check the
      # result explicitly and report it where it happens.
      # The install step cannot fail the job -- the installer exits non-zero
      # even on success, since it cannot start systemd units on a runner. Check
      # the real outcome instead, so a failed install is reported here rather
      # than surfacing two steps later as
      # "cp: cannot stat .../containers/storage/overlay/.".
      # Note the sudo: /home/uosserver is mode 700, so a bare test as the
      # runner user returns false even when the storage is present.
      - name: Verify install produced container storage
        run: |
          set -euo pipefail
          src=/home/uosserver/.local/share/containers/storage
          if ! sudo test -d "$src/overlay-images"; then
            echo "Install did not produce container storage." >&2
            echo "See the 'Install UniFi OS Server' step above for the real error." >&2
            sudo ls -la "$src" 2>&1 | head -15 >&2 || true
            exit 1
          fi
          echo "Container storage present:"
          sudo ls -1 "$src"

      - name: Get uosserver image for runner
        run: |
          mkdir -p /home/runner/.local/share/containers/storage/overlay
          sudo cp -a /home/uosserver/.local/share/containers/storage/overlay/. /home/runner/.local/share/containers/storage/overlay/
          mkdir -p /home/runner/.local/share/containers/storage/overlay-images
          sudo cp -a /home/uosserver/.local/share/containers/storage/overlay-images/. /home/runner/.local/share/containers/storage/overlay-images/
          mkdir -p /home/runner/.local/share/containers/storage/overlay-layers
          sudo cp -a /home/uosserver/.local/share/containers/storage/overlay-layers/. /home/runner/.local/share/containers/storage/overlay-layers/
          sudo chown -R runner:runner /home/runner/.local/share/containers/storage
          podman images

      - name: Login to GHCR
        uses: redhat-actions/podman-login@4c93cb1ea36b10156ea541570dc69bc04dffe10e # v1.1.2
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          registry: ${{ env.REGISTRY }}
      
      - name: Upload uosserver image
        id: tag
        run: |
          PODMAN_IMAGE_TAG=$(podman images uosserver --noheading | awk '{print $2}')
          PODMAN_IMAGE_ID=$(podman images uosserver --noheading | awk '{print $3}')
          REPO_OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          podman push $PODMAN_IMAGE_ID $REGISTRY/$REPO_OWNER_LC/uosserver:$PODMAN_IMAGE_TAG-linux-arm64

          echo "PODMAN_IMAGE_TAG=$PODMAN_IMAGE_TAG" >> "$GITHUB_OUTPUT"